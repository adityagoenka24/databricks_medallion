# This is a Declarative Automation Bundle definition for gridpulse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: gridpulse
  uuid: 44c4ee77-7338-477e-86db-3f8816be8e9b

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: Target Unity Catalog catalog
    default: gridpulse
  alert_email:
    description: Where job failure emails go
    default: codesclasses@gmail.com
  schema:
    description: Target schema for all tables
    default: default_schema

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-317bf3c3-beaf.cloud.databricks.com
    variables:
      catalog: gridpulse

  prod:
    mode: production
    workspace:
      host: https://dbc-317bf3c3-beaf.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/goenka.aditya.kol@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/goenka.aditya.kol@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: gridpulse

    permissions:
      - user_name: goenka.aditya.kol@gmail.com
        level: CAN_MANAGE
