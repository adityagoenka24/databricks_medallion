# The main pipeline for gridpulse

resources:
  pipelines:
    gridpulse_etl:
      name: gridpulse_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/gridpulse_etl"

      libraries:
        - glob:
            include: ../src/gridpulse_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
